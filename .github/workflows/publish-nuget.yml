name: Publish to NuGet

on:
  push:
    branches:
      - doprez

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Src/SteamAudio.NET.csproj

      - name: Build and Pack
        run: dotnet build Src/SteamAudio.NET.csproj -c Release -p:PackageId=Doprez.SteamAudio.NET -p:Version=4.8.1.${{ github.run_number }}

      - name: Push to NuGet
        run: dotnet nuget push Src/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
